# Deploy – Dev Stage

## Trigger
Runs automatically after a successful build.

## Steps
1. Update ECS service (Dev cluster) with the new image tag
2. Wait for service to stabilize
3. Smoke test: `GET /health` must return HTTP 200

## Environment Variables (injected via ECS task definition)
- APP_ENV=DEV
- APP_VERSION=${GIT_SHA}
- APP_MESSAGE=Welcome to Development
