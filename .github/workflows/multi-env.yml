name: TaskFlow Multi-Environment Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: taskflow
  ECS_CLUSTER: taskflow-multi-env

  DEV_SERVICE: taskflow-service-2tpd33cg
  STAGING_SERVICE: taskflow-service-9xd5md0r
  PROD_SERVICE: taskflow-prod

  CONTAINER_NAME: taskflow

jobs:

  # ============================================================
  # 1. BUILD ONCE AND PUSH TO ECR
  # ============================================================
  build:
    name: Build Once & Push Artifact
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: |
          mvn clean package -DskipTests

      - name: Set image tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Set image output
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Release artifact:"
          echo "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 2. DEPLOY SAME ARTIFACT TO DEV
  # ============================================================
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest

    needs: build

    environment: dev

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current Dev task definition
        id: dev-task
        run: |
          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$DEV_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current Dev task definition:"
          echo "$TASK_DEFINITION"

          if [ -z "$TASK_DEFINITION" ] || [ "$TASK_DEFINITION" = "None" ]; then
            echo "ERROR: Dev task definition not found"
            exit 1
          fi

          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      - name: Create Dev task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.dev-task.outputs.task_definition }}" \
            --query 'taskDefinition' \
            --output json > dev-current.json

          jq --arg IMAGE "${{ needs.build.outputs.image }}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            |
            .containerDefinitions |=
              map(
                if .name == "taskflow"
                then .image = $IMAGE
                else .
                end
              )
          ' dev-current.json > dev-new.json

      - name: Register Dev task definition
        id: register-dev
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://dev-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Dev task definition:"
          echo "$ARN"

          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy same artifact to Dev
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$DEV_SERVICE" \
            --task-definition "${{ steps.register-dev.outputs.arn }}"

      - name: Wait for Dev
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$DEV_SERVICE"

      - name: Verify Dev image
        run: |
          TASK=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$DEV_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          IMAGE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK" \
            --query 'tasks[0].containers[?name==`taskflow`].image' \
            --output text)

          echo "Expected:"
          echo "${{ needs.build.outputs.image }}"

          echo "Actual:"
          echo "$IMAGE"

          if [ "$IMAGE" != "${{ needs.build.outputs.image }}" ]; then
            echo "ERROR: Dev is not running the release artifact"
            exit 1
          fi

          echo "PASS: Dev is running the exact release artifact."


  # ============================================================
  # 3. PROMOTE SAME ARTIFACT TO STAGING
  # ============================================================
  deploy-staging:
    name: Promote to Staging
    runs-on: ubuntu-latest

    needs: [build, deploy-dev]

    environment: staging

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current Staging task definition
        id: staging-task
        run: |
          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$STAGING_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current Staging task definition:"
          echo "$TASK_DEFINITION"

          if [ -z "$TASK_DEFINITION" ] || [ "$TASK_DEFINITION" = "None" ]; then
            echo "ERROR: Staging task definition not found"
            exit 1
          fi

          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      - name: Create Staging task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.staging-task.outputs.task_definition }}" \
            --query 'taskDefinition' \
            --output json > staging-current.json

          jq --arg IMAGE "${{ needs.build.outputs.image }}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            |
            .containerDefinitions |=
              map(
                if .name == "taskflow"
                then .image = $IMAGE
                else .
                end
              )
          ' staging-current.json > staging-new.json

      - name: Register Staging task definition
        id: register-staging
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://staging-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Staging task definition:"
          echo "$ARN"

          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Promote same artifact to Staging
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$STAGING_SERVICE" \
            --task-definition "${{ steps.register-staging.outputs.arn }}"

      - name: Wait for Staging
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$STAGING_SERVICE"

      - name: Verify Staging image
        run: |
          TASK=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$STAGING_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          IMAGE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK" \
            --query 'tasks[0].containers[?name==`taskflow`].image' \
            --output text)

          echo "Expected:"
          echo "${{ needs.build.outputs.image }}"

          echo "Actual:"
          echo "$IMAGE"

          if [ "$IMAGE" != "${{ needs.build.outputs.image }}" ]; then
            echo "ERROR: Staging is not running the same artifact"
            exit 1
          fi

          echo "PASS: Staging is running the exact same artifact."

      - name: Staging health gate
        run: |
          echo "Checking Staging:"
          echo "${{ secrets.STAGING_APP_URL }}/health"

          STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/staging-health.json \
            --write-out "%{http_code}" \
            "${{ secrets.STAGING_APP_URL }}/health")

          echo "HTTP status: $STATUS"
          echo "Response:"
          cat /tmp/staging-health.json

          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Staging health check failed"
            exit 1
          fi

          if ! grep -q '"status":"UP"' /tmp/staging-health.json; then
            echo "FAIL: Staging application did not report UP"
            exit 1
          fi

          echo "PASS: Staging health gate passed."


  # ============================================================
  # 4. PRODUCTION — requires manual approval
  # ============================================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest

    needs: [build, deploy-staging]

    environment:
      name: production

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current Production task definition
        id: prod-task
        run: |
          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$PROD_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current Production task definition:"
          echo "$TASK_DEFINITION"

          if [ -z "$TASK_DEFINITION" ] || [ "$TASK_DEFINITION" = "None" ]; then
            echo "ERROR: Production task definition not found"
            exit 1
          fi

          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      - name: Create Production task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.prod-task.outputs.task_definition }}" \
            --query 'taskDefinition' \
            --output json > prod-current.json

          jq --arg IMAGE "${{ needs.build.outputs.image }}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            |
            .containerDefinitions |=
              map(
                if .name == "taskflow"
                then .image = $IMAGE
                else .
                end
              )
          ' prod-current.json > prod-new.json

      - name: Register Production task definition
        id: register-prod
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://prod-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Production task definition:"
          echo "$ARN"

          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy same artifact to Production
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$PROD_SERVICE" \
            --task-definition "${{ steps.register-prod.outputs.arn }}"

      - name: Wait for Production
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$PROD_SERVICE"

      - name: Verify Production image
        run: |
          TASK=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$PROD_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          IMAGE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK" \
            --query 'tasks[0].containers[?name==`taskflow`].image' \
            --output text)

          echo "Expected:"
          echo "${{ needs.build.outputs.image }}"

          echo "Actual:"
          echo "$IMAGE"

          if [ "$IMAGE" != "${{ needs.build.outputs.image }}" ]; then
            echo "ERROR: Production is not running the release artifact"
            exit 1
          fi

          echo "PASS: Production is running the exact release artifact."

      - name: Production health check
        run: |
          STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/prod-health.json \
            --write-out "%{http_code}" \
            "${{ secrets.PROD_APP_URL }}/health")

          echo "HTTP status: $STATUS"
          cat /tmp/prod-health.json

          if [ "$STATUS" != "200" ]; then
            echo "Production health check failed"
            exit 1
          fi

          echo "Production deployment verified."
