name: TaskFlow CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: taskflow
  ECS_CLUSTER: taskflow-multi-env
  ECS_DEV_SERVICE: taskflow-service-2tpd33cg
  ECS_STAGING_SERVICE: taskflow-service-9xd5md0r

jobs:
  build-and-deploy:
    name: Build, Dev and Staging
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # =========================================================
      # 2. JAVA
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # =========================================================
      # 3. BUILD JAR ONCE
      # =========================================================
      - name: Build JAR
        run: mvn clean package -DskipTests

      # =========================================================
      # 4. AWS CREDENTIALS
      # =========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # =========================================================
      # 5. ECR LOGIN
      # =========================================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # =========================================================
      # 6. SET IMAGE INFORMATION
      # =========================================================
      - name: Set image information
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

          echo "Release image:"
          echo "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA}"

      # =========================================================
      # 7. BUILD DOCKER IMAGE ONCE
      # =========================================================
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      # =========================================================
      # 8. PUSH IMAGE ONCE
      # =========================================================
      - name: Push Docker image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # =========================================================
      # 9. SHOW ARTIFACT
      # =========================================================
      - name: Show release artifact
        run: |
          echo "========================================"
          echo "TaskFlow Release Artifact"
          echo "========================================"
          echo "Image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "========================================"

      # =========================================================
      # 10. GET CURRENT DEV TASK DEFINITION
      # =========================================================
      - name: Get current Dev task definition
        id: dev-task
        run: |
          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_DEV_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current Dev task definition:"
          echo "$TASK_DEFINITION"

          if [ -z "$TASK_DEFINITION" ] || [ "$TASK_DEFINITION" = "None" ]; then
            echo "ERROR: Dev task definition not found"
            exit 1
          fi

          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 11. CREATE DEV TASK DEFINITION
      # =========================================================
      - name: Create Dev task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.dev-task.outputs.task_definition }}" \
            --query 'taskDefinition' \
            --output json > task-definition.json

          jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            |
            .containerDefinitions |=
              map(
                if .name == "taskflow"
                then .image = $IMAGE
                else .
                end
              )
          ' task-definition.json > dev-task-definition.json

      # =========================================================
      # 12. REGISTER DEV TASK DEFINITION
      # =========================================================
      - name: Register Dev task definition
        id: register-dev
        run: |
          DEV_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://dev-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Dev task definition:"
          echo "$DEV_TASK_DEFINITION"

          echo "task_definition=$DEV_TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 13. DEPLOY DEV
      # =========================================================
      - name: Deploy to Dev
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_DEV_SERVICE" \
            --task-definition "${{ steps.register-dev.outputs.task_definition }}" \
            --force-new-deployment

      # =========================================================
      # 14. WAIT FOR DEV
      # =========================================================
      - name: Wait for Dev deployment
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_DEV_SERVICE"

      # =========================================================
      # 15. VERIFY DEV
      # =========================================================
      - name: Verify Dev service
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_DEV_SERVICE" \
            --query 'services[0].{Service:serviceName,Desired:desiredCount,Running:runningCount,TaskDefinition:taskDefinition}' \
            --output table

      # =========================================================
      # 16. VERIFY DEV IMAGE
      # =========================================================
      - name: Verify Dev image
        run: |
          RUNNING_TASK=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_DEV_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$RUNNING_TASK" \
            --query 'tasks[0].containers[?name==`taskflow`].image' \
            --output text

      # =========================================================
      # 17. GET CURRENT STAGING TASK DEFINITION
      # =========================================================
      - name: Get current Staging task definition
        id: staging-task
        run: |
          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_STAGING_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current Staging task definition:"
          echo "$TASK_DEFINITION"

          if [ -z "$TASK_DEFINITION" ] || [ "$TASK_DEFINITION" = "None" ]; then
            echo "ERROR: Staging task definition not found"
            exit 1
          fi

          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 18. CREATE STAGING TASK DEFINITION
      #     ONLY IMAGE CHANGES
      # =========================================================
      - name: Create Staging task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.staging-task.outputs.task_definition }}" \
            --query 'taskDefinition' \
            --output json > staging-task-definition.json

          jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            |
            .containerDefinitions |=
              map(
                if .name == "taskflow"
                then .image = $IMAGE
                else .
                end
              )
          ' staging-task-definition.json > new-staging-task-definition.json

      # =========================================================
      # 19. REGISTER STAGING TASK DEFINITION
      # =========================================================
      - name: Register Staging task definition
        id: register-staging
        run: |
          STAGING_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://new-staging-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Staging task definition:"
          echo "$STAGING_TASK_DEFINITION"

          echo "task_definition=$STAGING_TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 20. PROMOTE SAME IMAGE TO STAGING
      # =========================================================
      - name: Promote to Staging
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_STAGING_SERVICE" \
            --task-definition "${{ steps.register-staging.outputs.task_definition }}" \
            --force-new-deployment

      # =========================================================
      # 21. WAIT FOR STAGING
      # =========================================================
      - name: Wait for Staging deployment
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_STAGING_SERVICE"

      # =========================================================
      # 22. VERIFY STAGING SERVICE
      # =========================================================
      - name: Verify Staging service
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_STAGING_SERVICE" \
            --query 'services[0].{Service:serviceName,Desired:desiredCount,Running:runningCount,TaskDefinition:taskDefinition}' \
            --output table

      # =========================================================
      # 23. VERIFY STAGING IMAGE
      # =========================================================
      - name: Verify Staging image
        run: |
          RUNNING_TASK=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_STAGING_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          STAGING_IMAGE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$RUNNING_TASK" \
            --query 'tasks[0].containers[?name==`taskflow`].image' \
            --output text)

          echo "Staging image:"
          echo "$STAGING_IMAGE"

          EXPECTED_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          if [ "$STAGING_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "ERROR: Staging image does not match the release artifact"
            echo "Expected: $EXPECTED_IMAGE"
            echo "Actual:   $STAGING_IMAGE"
            exit 1
          fi

          echo "PASS: Staging is using the exact same image."

      # =========================================================
      # 24. STAGING HEALTH GATE
      # =========================================================
      - name: Staging health gate
        run: |
          echo "Checking Staging ALB target health..."

          TG_ARN=$(aws elbv2 describe-target-groups \
            --names taskflow-staging-tg \
            --region "$AWS_REGION" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)

          HEALTH=$(aws elbv2 describe-target-health \
            --target-group-arn "$TG_ARN" \
            --region "$AWS_REGION" \
            --query 'TargetHealthDescriptions[*].TargetHealth.State' \
            --output text)

          echo "Staging target health: $HEALTH"

          if echo "$HEALTH" | grep -qw "healthy"; then
            echo "PASS: Staging health gate passed."
          else
            echo "FAIL: Staging target is not healthy."
            exit 1
          fi
