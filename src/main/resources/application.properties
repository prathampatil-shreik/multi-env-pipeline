# ============================================================
# TaskFlow - Task Management System
# ============================================================
# Environment-specific values are supplied via environment variables.
# Defaults below are for LOCAL development only.
# AWS environments (Dev/Staging/Production) will override these
# via ECS task definition environment variables.
# ============================================================

server.port=8080

# Application identity - read from environment variables
app.env=${APP_ENV:LOCAL}
app.version=${APP_VERSION:local-dev}
app.message=${APP_MESSAGE:Welcome to Local Development}

# Actuator - expose health endpoint only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
