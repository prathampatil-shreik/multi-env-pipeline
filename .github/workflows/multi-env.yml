name: TaskFlow Multi-Environment Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION:       ap-south-1
  ECR_REPOSITORY:   taskflow
  ECS_CLUSTER:      taskflow-multi-env
  DEV_SERVICE:      taskflow-service-2tpd33cg
  STAGING_SERVICE:  taskflow-service-9xd5md0r
  PROD_SERVICE:     taskflow-prod
  CONTAINER_NAME:   taskflow

jobs:

  # ============================================================
  # 1. BUILD ONCE — one image, one SHA tag
  # ============================================================
  build:
    name: Build Once & Push Artifact
    runs-on: ubuntu-latest

    outputs:
      image:     ${{ steps.image-output.outputs.image }}
      image-tag: ${{ steps.image-output.outputs.image-tag }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Set image outputs
        id: image-output
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "========================================"
          echo "Release artifact: $IMAGE"
          echo "========================================"
          echo "image=$IMAGE"         >> "$GITHUB_OUTPUT"
          echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 2. DEPLOY TO DEV — same artifact, preserve env config
  # ============================================================
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    environment: dev

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Get current Dev task definition
        id: dev-task
        run: |
          TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$DEV_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current Dev task definition: $TASK_DEF"

          if [ -z "$TASK_DEF" ] || [ "$TASK_DEF" = "None" ]; then
            echo "ERROR: Could not find task definition for $DEV_SERVICE in $ECS_CLUSTER"
            exit 1
          fi

          echo "task_definition=$TASK_DEF" >> "$GITHUB_OUTPUT"

      - name: Create new Dev task definition (image only)
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.dev-task.outputs.task_definition }}" \
            --query 'taskDefinition' \
            --output json > dev-current.json

          jq --arg IMAGE "${{ needs.build.outputs.image }}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == "taskflow"
                then .image = $IMAGE
                else .
                end
              )
          ' dev-current.json > dev-new.json

          echo "New Dev image:"
          jq -r '.containerDefinitions[] | select(.name=="taskflow") | .image' dev-new.json

      - name: Register Dev task definition
        id: register-dev
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://dev-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered: $ARN"

          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            echo "ERROR: Failed to register Dev task definition"
            exit 1
          fi

          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Update Dev service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$DEV_SERVICE" \
            --task-definition "${{ steps.register-dev.outputs.arn }}"

      - name: Wait for Dev stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$DEV_SERVICE"

      - name: Verify Dev image
        run: |
          TASK=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$DEV_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          if [ -z "$TASK" ] || [ "$TASK" = "None" ]; then
            echo "ERROR: No running task found in Dev"
            exit 1
          fi

          ACTUAL=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK" \
            --query 'tasks[0].containers[?name==`taskflow`].image' \
            --output text)

          EXPECTED="${{ needs.build.outputs.image }}"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Dev is not running the release artifact"
            exit 1
          fi

          echo "PASS: Dev is running the exact release artifact."


  # ============================================================
  # 3. PROMOTE TO STAGING — same artifact, ECS health gate
  # ============================================================
  deploy-staging:
    name: Promote to Staging
    runs-on: ubuntu-latest
    needs: [build, deploy-dev]
    environment: staging

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Get current Staging task definition
        id: staging-task
        run: |
          TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$STAGING_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current Staging task definition: $TASK_DEF"

          if [ -z "$TASK_DEF" ] || [ "$TASK_DEF" = "None" ]; then
            echo "ERROR: Could not find task definition for $STAGING_SERVICE in $ECS_CLUSTER"
            exit 1
          fi

          echo "task_definition=$TASK_DEF" >> "$GITHUB_OUTPUT"

      - name: Create new Staging task definition (image only)
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.staging-task.outputs.task_definition }}" \
            --query 'taskDefinition' \
            --output json > staging-current.json

          jq --arg IMAGE "${{ needs.build.outputs.image }}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == "taskflow"
                then .image = $IMAGE
                else .
                end
              )
          ' staging-current.json > staging-new.json

          echo "New Staging image:"
          jq -r '.containerDefinitions[] | select(.name=="taskflow") | .image' staging-new.json

      - name: Register Staging task definition
        id: register-staging
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://staging-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered: $ARN"

          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            echo "ERROR: Failed to register Staging task definition"
            exit 1
          fi

          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Update Staging service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$STAGING_SERVICE" \
            --task-definition "${{ steps.register-staging.outputs.arn }}"

      - name: Wait for Staging stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$STAGING_SERVICE"

      - name: Verify Staging image
        run: |
          TASK=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$STAGING_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          if [ -z "$TASK" ] || [ "$TASK" = "None" ]; then
            echo "ERROR: No running task found in Staging"
            exit 1
          fi

          ACTUAL=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK" \
            --query 'tasks[0].containers[?name==`taskflow`].image' \
            --output text)

          EXPECTED="${{ needs.build.outputs.image }}"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Staging is not running the same artifact as Dev"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "PASS: Staging is running the exact same artifact as Dev."

      - name: Staging health gate
        run: |
          echo "Checking Staging ECS service health..."

          RUNNING=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$STAGING_SERVICE" \
            --query 'services[0].runningCount' \
            --output text)

          DESIRED=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$STAGING_SERVICE" \
            --query 'services[0].desiredCount' \
            --output text)

          echo "Desired tasks: $DESIRED"
          echo "Running tasks: $RUNNING"

          if [ "$RUNNING" = "$DESIRED" ] && [ "$RUNNING" != "0" ]; then
            echo "PASS: Staging health gate passed."
          else
            echo "FAIL: Staging service is not healthy (desired=$DESIRED, running=$RUNNING)"
            exit 1
          fi


  # ============================================================
  # 4. PRODUCTION — manual approval required
  # ============================================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    environment:
      name: production

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Get current Production task definition
        id: prod-task
        run: |
          TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$PROD_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current Production task definition: $TASK_DEF"

          if [ -z "$TASK_DEF" ] || [ "$TASK_DEF" = "None" ]; then
            echo "ERROR: Could not find task definition for $PROD_SERVICE in $ECS_CLUSTER"
            exit 1
          fi

          echo "task_definition=$TASK_DEF" >> "$GITHUB_OUTPUT"

      - name: Create new Production task definition (image only)
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.prod-task.outputs.task_definition }}" \
            --query 'taskDefinition' \
            --output json > prod-current.json

          jq --arg IMAGE "${{ needs.build.outputs.image }}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == "taskflow"
                then .image = $IMAGE
                else .
                end
              )
          ' prod-current.json > prod-new.json

          echo "New Production image:"
          jq -r '.containerDefinitions[] | select(.name=="taskflow") | .image' prod-new.json

      - name: Register Production task definition
        id: register-prod
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://prod-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered: $ARN"

          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            echo "ERROR: Failed to register Production task definition"
            exit 1
          fi

          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Update Production service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$PROD_SERVICE" \
            --task-definition "${{ steps.register-prod.outputs.arn }}"

      - name: Wait for Production stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$PROD_SERVICE"

      - name: Verify Production image
        run: |
          TASK=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$PROD_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          if [ -z "$TASK" ] || [ "$TASK" = "None" ]; then
            echo "ERROR: No running task found in Production"
            exit 1
          fi

          ACTUAL=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK" \
            --query 'tasks[0].containers[?name==`taskflow`].image' \
            --output text)

          EXPECTED="${{ needs.build.outputs.image }}"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Production is not running the release artifact"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "PASS: Production is running the exact release artifact."
          echo "========================================"
          echo "Build Once / Deploy Many — COMPLETE"
          echo "Dev SHA    = $EXPECTED"
          echo "Staging SHA = $EXPECTED"
          echo "Prod SHA   = $ACTUAL"
          echo "All three environments running the same artifact."
          echo "========================================"

      - name: Production health gate
        run: |
          echo "Checking Production ECS service health..."

          RUNNING=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$PROD_SERVICE" \
            --query 'services[0].runningCount' \
            --output text)

          DESIRED=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$PROD_SERVICE" \
            --query 'services[0].desiredCount' \
            --output text)

          echo "Desired tasks: $DESIRED"
          echo "Running tasks: $RUNNING"

          if [ "$RUNNING" = "$DESIRED" ] && [ "$RUNNING" != "0" ]; then
            echo "PASS: Production health gate passed."
          else
            echo "FAIL: Production service is not healthy (desired=$DESIRED, running=$RUNNING)"
            exit 1
          fi
